name: Build desktop distributions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "browser-extension/**"
      - "desktop/**"
      - "css/**"
      - "data/**"
      - "images/**"
      - "js/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-distributions.yml"
  push:
    branches: [main]
    paths:
      - "browser-extension/**"
      - "desktop/**"
      - "css/**"
      - "data/**"
      - "images/**"
      - "js/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-distributions.yml"

permissions:
  contents: read

jobs:
  extension:
    name: Chrome and Edge extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package browser extension
        run: |
          version=$(node -p "require('./browser-extension/manifest.json').version")
          mkdir -p "dist/release-$version"
          cd browser-extension
          zip -r "../dist/release-$version/Rhine-Lab-Browser-Extension-$version.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Rhine-Lab-Browser-Extension
          path: dist/release-*/*.zip
          retention-days: 30

  windows:
    name: Windows installable application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NSIS Windows app
        run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Rhine-Lab-Windows-Setup
          path: dist/release-*/*.exe
          retention-days: 30
          if-no-files-found: error

  macos:
    name: macOS universal test application
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify desktop compatibility
        run: pnpm verify:desktop
      - name: Build ad-hoc-signed macOS test package
        run: pnpm desktop:build:mac
      - name: Verify universal test bundle
        run: |
          version=$(node -p "require('./package.json').version")
          app="dist/release-$version/mac-universal/Rhine Lab.app"
          lipo "$app/Contents/MacOS/Rhine Lab" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Rhine Lab" -e "console.log('Packaged Electron runtime started:', process.arch, process.versions.electron)"
      - uses: actions/upload-artifact@v4
        with:
          name: Rhine-Lab-macOS-Universal-Test
          path: |
            dist/release-*/*-macOS-universal.dmg
            dist/release-*/*-macOS-universal.zip
          retention-days: 30
          if-no-files-found: error
