name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload Rhine Lab iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.halleylab.rhinelab
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Apple credentials
        shell: bash
        run: |
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode 26
        shell: bash
        run: |
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -n 1)
          test -n "$xcode_path" || { echo '::error::Xcode 26 is unavailable on this runner.'; exit 1; }
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize Capacitor iOS project
        run: |
          pnpm mobile:prepare
          pnpm mobile:assets
          pnpm exec cap sync ios
          pnpm exec capacitor-assets generate --ios

      - name: Prepare App Store Connect key and build metadata
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r' > "$key_path"
          chmod 600 "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || { echo '::error::APP_STORE_CONNECT_PRIVATE_KEY is not a valid p8 key.'; exit 1; }

          version=$(node -p "require('./package.json').version")
          base_build=$(grep -m 1 'CURRENT_PROJECT_VERSION = ' ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9]+);/\1/')
          build=$((base_build + GITHUB_RUN_NUMBER))
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD=$build" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        shell: bash
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RhineLab.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD"

      - name: Upload to TestFlight
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/RhineLab.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
