name: Publish Rhine Lab release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          release_tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $release_tag"
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "Rhine Lab ${RELEASE_TAG#v}" --generate-notes --latest

  windows:
    name: Publish Windows updater package
    needs: release
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NSIS updater package
        run: pnpm desktop:build
      - name: Upload Windows installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $files = Get-ChildItem "dist/release-$version" -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'No Windows release files were generated.' }
          gh release upload $env:RELEASE_TAG $files --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Rhine-Lab-Windows-Setup
          path: |
            dist/release-*/*.exe
            dist/release-*/*.blockmap
            dist/release-*/latest.yml
          retention-days: 30
          if-no-files-found: error

  android:
    name: Publish Android updater package
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RHINE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RHINE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RHINE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing identity
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$RHINE_ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$RHINE_ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$RHINE_ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          keystore_path="$RUNNER_TEMP/rhine-lab-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "RHINE_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Synchronize Capacitor
        run: pnpm mobile:sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Verify release signing certificate
        shell: bash
        run: |
          expected=$(tr -d ':[:space:]' < android/release-signing-certificate.sha256 | tr '[:lower:]' '[:upper:]')
          actual=$(keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          test -n "$actual" || { echo "Unable to read APK signing certificate"; exit 1; }
          test "$actual" = "$expected" || { echo "Unexpected APK signing certificate: $actual"; exit 1; }
      - name: Prepare release files
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p "dist/release-${version}"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/release-${version}/Rhine-Lab-${version}-Android.apk"
          sha256sum "dist/release-${version}/Rhine-Lab-${version}-Android.apk" > "dist/release-${version}/Rhine-Lab-${version}-Android.apk.sha256"
      - name: Upload APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/release-*/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Rhine-Lab-Android
          path: dist/release-*/*
          retention-days: 30
          if-no-files-found: error
